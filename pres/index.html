# La Classe `Basis`
### Pour les calculs quantiques en coordonnées cylindriques


## Aperçu
- Encapsule les paramètres et fonctions pour définir un ensemble de base.
- Calcule les fonctions de base et les valeurs maximales des nombres quantiques.


## Fonctions Clés
- `nu(i)`: Calcule la valeur de ν pour un indice i donné.
- `calc_mMax()`: Trouve la valeur maximale du nombre quantique m.
- `calc_nMax()`: Détermine le vecteur des valeurs maximales de n pour chaque m.
- `calc_n_zMax()`: Calcule la matrice des valeurs maximales de n_z pour chaque couple (m, n).


## Composants de Fonction de Base
- `zPart(z, nz)`: Évalue la composante Z en coordonnées cylindriques.
- `rPart(r, m, n)`: Évalue la composante R en coordonnées cylindriques.
- `basisFunc(m, n, n_z, zVals, rVals)`: Calcule la matrice de la fonction de base.

# Calculs des nombres quantiques

On définit : 

`$$
\nu(i) \equiv (N+2).Q^\frac{2}{3}+\frac{1}{2}-i.Q
$$`

`$$
m^\textrm{max} \equiv \textrm{sup}\left\{i:\nu(i)\ge 1\right\}.
$$`

Nombres quantiques définis par :
`$$
\begin{alignedat}{4}
0 & \le &&m  & \lt & \textrm{ mMax} \equiv m^\textrm{max}\\
0 & \le &&n  & \lt & \textrm{ nMax[m]} \equiv \frac{1}{2}(m^\textrm{max}-m-1) + 1\\
0 & \le &&n_z& \lt & \textrm{ n\_zMax[m, n]} \equiv \nu(m+2n+1).
\end{alignedat}
$$`

--- 

`$$
\psi_{m,n,n_z}(r_\perp, \theta, z)
        \equiv
    Z(z, n_z)
    .
    R(r_\perp, m, n)
    .
         e^{im\theta}
$$`


`$$
Z(z, n_z)
\equiv
         \frac{1}{\sqrt{b_z}}
         \frac{1}{\sqrt{2^{n_z} \sqrt{\pi}n_z!}}
         e^{-\frac{z^2}{2b_z^2}}H_{n_z}\left(\frac{z}{b_z}\right)
$$`

`$$
R(r_\perp, m, n)
         \equiv
         \frac{1}{b_{\perp}\sqrt{\pi}}
         \sqrt{\frac{n!}{(n+|m|)!}}
         e^{-\frac{r_{\perp}^2}{2b_{\perp}^2}}
         \left(\frac{r_{\perp}}{b_{\perp}}\right)^{|m|}
         L_n^{|m|}\left(\frac{r_{\perp}^2}{b_{\perp}^2}\right).
$$`

};

# Polynômes d'Hermite
.row[
.column.w45.middle[
Classe de calcul des polynômes d'Hermite :
`$$
\left\{
\begin{aligned}
&H_0 = 1 \\
&H_1 = 2X \\
&\forall n \geq 2, \; H_n = H_1 H_{n-1} - 2(n-1) H_{n-2}
\end{aligned}
\right.
$$`
Par récurrence, `$H_n$` est de degré `$n$`.
]
.column.w50.middle[
```c++
class Hermite_compute {
  public:
  arma::rowvec range;
  arma::mat values;
  void eval(arma::rowvec x, unsigned int n);
};
```
]
]
.row[
.column.w45.middle[]
.column.w50.middle[
* constructeur : par défaut
* `range` : égal à l'input `x $=(x_0, \ldots, x_{k-1})$`
* `values` : `$$\begin{pmatrix}
H_0(x_0) & H_0(x_1) & \ldots & H_0(x_{k-1}) \\
H_1(x_0) & H_1(x_1) & \ldots & H_1(x_{k-1}) \\
H_2(x_0) & H_2(x_1) & \ldots & H_2(x_{k-1}) \\
\vdots & \vdots & \vdots & \vdots \\
H_n(x_0) & H_n(x_1) & \ldots & H_n(x_{k-1})
\end{pmatrix}$$`
* procédure `eval` : évite les redondances
]
]

# Polynômes de Laguerre
.row[
.column.w50.middle[
Classe de calcul des polynômes de Laguerre :
`$$
\left\{
\begin{aligned}
&L_0 ^m(\eta)= 1 \\
&L_1 ^m(\eta)= 1 + m - \eta \\
&\forall (m,n) \in \mathbb{N}^2, n > 1, \\ 
&L_n ^m(\eta) = \left(2 + \frac{m - 1 - \eta}{n}  \right) L_{n-1}^m \\
&- \left(1 + \frac{m - 1}{n}  \right)L_{n-2}^m(\eta) 
\end{aligned}
\right.
$$`
]


.column.w50.middle[
```c++

  private:

};

# Optimisations

```c++
arma::mat calcDensityOpti(arma::vec const& rvals, arma::vec const& zvals, Basis& basis){
  arma::mat result = arma::zeros(rvals.n_elem, zvals.n_elem); // number of points on r- and z- axes
    int a = 0;
    int b = 0;
    int n_vec = 0; // total number of vectors
    int* n_vec_per_m = new int[basis.mMax]; // number of vectors for each value of m

    for (unsigned int m = 0; m < basis.mMax; m++)
    {
        n_vec_per_m[m] = 0;
        for (int n = 0; n < basis.nMax(m); n++)
            n_vec_per_m[m] += basis.n_zMax(m, n) >= 0 ? basis.n_zMax(m, n) : 0;
        n_vec += n_vec_per_m[m];
    }

    arma::mat* func = new arma::mat[n_vec]; // pre-computing the basis

    // [CODE CONDENSÉ] pré-calcul des fonctions basis.basisFunc(triplet i) dans func[i]

    for (unsigned int m = 0; m < basis.mMax; m++) {
        int start = a;
        int next_stop = a + n_vec_per_m[m];
        for (; a < next_stop; a++) {
            for (b = start; b < a; b++)
                result += func[a] % func[b] * rho(a, b);
        }
    }

    result = 2 * result;
    
    for (int i = 0; i < n_vec; i++)
    {
        result += func[i] % func[i] * rho(i, i);
        a++;
    }

    delete[] n_vec_per_m;
    delete[] func;
    return result;
  }
```
